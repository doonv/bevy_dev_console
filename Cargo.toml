
[package]
name = "bevy_dev_console"
version = "0.1.0-dev"
edition = "2024"
exclude = ["assets/", "doc/", ".github/"]
keywords = ["bevy", "console", "development", "source"]
license = "MIT OR Apache-2.0"
rust-version = "1.89.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
default = ["builtin-parser", "completions", "builtin-parser-completions"]

completions = []

builtin-parser-completions = [
    "completions",
    "builtin-parser",
    "dep:fuzzy-matcher",
]

builtin-parser = [
    "dep:logos",
    "dep:variadics_please",
    "dep:kinded",
    "dep:thiserror",
    "dep:smallvec",
    "dep:pastey",
]

[dependencies]
bevy = { version = "0.18.1", default-features = false, features = [
    "bevy_color",
    "bevy_log",
] }
bevy_egui = "0.39.1"
chrono = "0.4.44"
ansitok = "0.3.0"
anstyle = "1.0.14"

# builtin-parser features
pastey = { version = "*", optional = true }
logos = { version = "0.16.0", optional = true }
fuzzy-matcher = { version = "0.3.7", optional = true }
variadics_please = { version = "2.0.0", optional = true }
kinded = { version = "0.5.0", optional = true }
thiserror = { version = "2.0.18", optional = true }
smallvec = { version = "1", optional = true }

[dev-dependencies]
bevy = { version = "0.18.1", default-features = false, features = ["2d"] }
nu-ansi-term = "0.50.3"

[package.metadata.docs.rs]
rustc-args = ["--cfg", "docsrs_dep"]
rustdoc-args = [
    "--cfg",
    "docsrs",
    "--generate-link-to-definition",
    "--generate-macro-expansion",
    "--html-after-content",
    "docs-rs/trait-tags.html",

]


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs_dep)'] }
# missing_docs = "warn"

[lints.clippy]
type_complexity = "allow"
must_use_candidate = "warn"
too_many_arguments = "allow"
str_to_string = "warn"


# Required to make `cargo doc` scrape examples,
# otherwise it will skip them as they require dev depenendencies
[[example]]
name = "basic"
doc-scrape-examples = true
